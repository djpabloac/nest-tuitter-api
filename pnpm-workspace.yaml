# Overrides de seguridad movidos desde package.json: con pnpm 10 el CLI avisa
# "The 'pnpm' field in package.json is no longer read by pnpm" y las claves de
# package.json se ignoran, así que los overrides van acá.
overrides:
  multer: '>=2.4.0 <3'
  webpack: '>=5.112.2 <6'
  js-yaml@3: '>=3.15.2 <4'
  js-yaml@4: '>=4.3.2 <5'
  fast-uri@3: '>=3.1.6 <4'
  ip-address: '>=10.5.1 <11'
  brace-expansion@1: '>=1.1.21 <2'
  brace-expansion@5: '>=5.0.9 <6'
  qs: '>=6.16.1 <7'
  handlebars: '>=4.7.10 <5'
  browserslist: '>=4.29.4 <5'
  baseline-browser-mapping: '>=2.11.0 <3'
